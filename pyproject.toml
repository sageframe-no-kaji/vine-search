[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vine-search"
version = "0.1.1"
description = "Self-hosted Amazon Vine discovery and review progress."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Andrew Marcus"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.10,<3",
  "playwright>=1.55,<2",
  "beautifulsoup4>=4.13,<5",
  "python-multipart>=0.0.20",
  "python-dotenv>=1,<2",
  "typer>=0.16,<1",
  "websockets>=15,<17",
]

[project.scripts]
vine-search = "vine_search.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "mypy>=1.18",
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-asyncio>=1",
  "pre-commit>=4",
  "types-beautifulsoup4",
  "pip-audit>=2.9",
  "pyyaml>=6",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vine_search"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=vine_search --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
markers = ["browser: integrated browser tests", "live: authorized live Amazon checks"]

[tool.coverage.run]
branch = true
source = ["vine_search"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
