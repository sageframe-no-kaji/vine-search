repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: Mypy strict
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
